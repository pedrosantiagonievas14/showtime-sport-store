<!doctype html>
<html lang="es-AR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer"><title>Preferencias de email · Showtime</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f4f4f4;color:#151515;font-family:Arial,sans-serif}main{background:white;padding:36px;max-width:430px;margin:16px;border-top:6px solid #ff6a00;border-radius:8px}h1{font-size:25px}p{line-height:1.6}button,a{font:inherit}button{background:#111;color:white;padding:14px 20px;border:0;border-radius:5px;cursor:pointer}button:disabled{opacity:.5}a{color:#b74700}#status{min-height:24px}</style></head><body><main><strong>SHOWTIME SPORT STORE</strong><h1>Dejar de recibir ofertas por mail</h1><p>Confirmá la baja de las promociones por email. Vas a poder seguir usando tu cuenta y recibiendo los avisos de tus pedidos.</p><button id="confirm" type="button">Confirmar baja</button><p id="status" role="status" aria-live="polite"></p><a href="https://showtimesportstore.com.ar/">Volver a la tienda</a></main><script>
'use strict';
const API='https://script.google.com/macros/s/AKfycbzmkMA7Y-tFsxzy-nynCwdOUs7h7KWZEUqxzvuQlizCoIgfuzw9IByHgYnfBnSxLG0W/exec';
const params=new URLSearchParams(location.search),id=params.get('id')||'',signature=params.get('signature')||'',button=document.getElementById('confirm'),status=document.getElementById('status');
if(!/^[a-f0-9-]{36}$/i.test(id)||!/^[a-f0-9]{64}$/.test(signature)){button.disabled=true;status.textContent='El enlace no es válido. Podés cambiar las preferencias desde Mi cuenta.';}
button.addEventListener('click',async()=>{button.disabled=true;status.textContent='Guardando tu preferencia…';const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),35000);try{const response=await fetch(API,{method:'POST',credentials:'omit',redirect:'follow',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action:'unsubscribe',id,signature}),signal:controller.signal});if(!response.ok)throw new Error('No pudimos conectar.');const result=await response.json();if(!result.ok)throw new Error(result.error||'No pudimos guardar la baja.');status.textContent='Listo. Ya no vas a recibir ofertas por mail de Showtime.';button.hidden=true;}catch(e){status.textContent='No pudimos confirmar la baja. Reintentá o ingresá a Mi cuenta.';button.disabled=false;}finally{clearTimeout(timer);}});
</script></body></html>
