<!doctype html><html lang="es-AR"><head><base target="_top"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pedidos · Showtime</title>
<style>*{box-sizing:border-box}body{margin:0;color:#202020;background:#f6f6f6;font:16px/1.5 system-ui,sans-serif}header{background:#202020;color:#fff;padding:1rem}main{max-width:1000px;margin:auto;padding:1rem}h1{font-size:1.4rem;margin:0}h2{font-size:1.1rem}input,select,button{font:inherit;padding:.65rem;border:1px solid #888;background:white;border-radius:4px}button{cursor:pointer}button:disabled{opacity:.5}label{display:grid;gap:.4rem;margin:.8rem 0}.tools{display:flex;flex-wrap:wrap;gap:1rem;align-items:center}.order{padding:1rem;background:white;border:1px solid #ccc;border-radius:6px;margin:1rem 0}.order p{margin:.4rem 0}.order ul{padding-left:1.2rem}.check{display:flex;gap:.6rem;align-items:center}.check input{width:20px;height:20px}.primary{background:#bc4200;color:#fff;border-color:#bc4200}.muted{font-size:.9rem;color:#555}#status{white-space:pre-wrap}a{color:#713000}.warning{background:#fff0d9;padding:.7rem}</style></head>
<body><header><h1>SHOWTIME · Pedidos online</h1></header><main><form id="login"><label>Contraseña del panel<input type="password" id="password" autocomplete="current-password" required></label><button class="primary">Ingresar</button></form><p id="status" role="status" aria-live="polite"></p><section id="work" hidden><div class="tools"><button id="refresh">Actualizar</button><label>Sucursal<select id="branch"><option value="">Ambas</option><option value="brown">Brown 153</option><option value="vm">Garibaldi 243</option></select></label><button id="logout">Cerrar sesión</button></div><p class="warning">Antes de reservar: verificá el stock físico, los talles y la sucursal; separá las prendas con el número de pedido. Un comprobante no confirma el cobro. Actualizá el stock del catálogo por el procedimiento habitual.</p><div id="orders"></div></section></main>
<script>
const $=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let token='',orders=[];
const labels={solicitado:'Revisar y separar',reservado:'Reservado · esperando transferencia',pago_a_verificar:'Comprobante: verificar cobro',pagado:'Pago confirmado',listo:'Listo para retirar',entregado:'Entregado',cancelado:'Cancelado'};
function rpc(method,...args){return new Promise((resolve,reject)=>google.script.run.withSuccessHandler(resolve).withFailureHandler(reject)[method](...args));}
function status(s){$('status').textContent=s;}
async function busy(button,work){button.disabled=true;try{await work();}catch(e){status(e.message||String(e));}finally{button.disabled=false;}}
$('login').onsubmit=e=>{e.preventDefault();busy(e.currentTarget.querySelector('button'),async()=>{token=await rpc('login',$('password').value);$('password').value='';$('login').hidden=true;$('work').hidden=false;await refresh();});};
async function refresh(){status('Cargando…');const result=await rpc('pedidosAdminList',token);orders=result.orders;render();status('Pedidos actualizados.');}
function render(){const branch=$('branch').value,list=orders.filter(o=>!branch||o.branch===branch);$('orders').innerHTML=list.length?list.map(o=>`<article class="order" data-id="${esc(o.id)}"><h2>${esc(o.id)} · ${o.branch==='brown'?'Brown 153':'Garibaldi 243'}</h2><p><strong>${esc(labels[o.status]||o.status)}</strong></p><p>${esc(o.customer?.Nombre)} · ${esc(o.customer?.Telefono)} · ${esc(o.customer?.Email)}</p><ul>${o.items.map(i=>`<li>${esc(i.name)} · Talle ${esc(i.size)} · x${i.qty}</li>`).join('')}</ul><p>Total: ${o.total?'ARS '+o.total:'A confirmar'}</p>${o.notificationPending?'<p class="warning">Aviso automático pendiente. Contactá al cliente desde el local.</p>':''}${o.receiptUrl?`<a href="${esc(o.receiptUrl)}" target="_blank" rel="noopener">Abrir comprobante privado en Drive</a>`:''}${o.status==='solicitado'?'<label>Importe final en ARS<input data-total type="number" min="1" step="1" value="'+(o.total||'')+'" required></label><label class="check"><input data-separated type="checkbox">Verifiqué los talles y separé físicamente la mercadería.</label><button class="primary" data-next="reservado">Confirmar reserva y habilitar transferencia</button>':''}${o.status==='pago_a_verificar'?'<p class="muted">Verificá el ingreso del dinero en la cuenta bancaria antes de confirmar.</p><button class="primary" data-next="pagado">Cobro verificado en el banco</button> <button data-next="reservado">Solicitar otro comprobante</button>':''}${o.status==='reservado'?'<button class="primary" data-next="pagado">Cobro verificado en el banco</button>':''}${o.status==='pagado'?'<button class="primary" data-next="listo">Marcar listo para retirar</button>':''}${o.status==='listo'?'<button class="primary" data-next="entregado">Marcar entregado</button>':''}${['solicitado','reservado'].includes(o.status)?' <button data-next="cancelado">Cancelar pedido sin pago</button>':''}</article>`).join(''):'<p>No hay pedidos para esta sucursal.</p>';
 document.querySelectorAll('[data-next]').forEach(button=>button.onclick=()=>busy(button,async()=>{const el=button.closest('[data-id]'),o=orders.find(x=>x.id===el.dataset.id),next=button.dataset.next;if(next==='pagado'&&!confirm('¿Verificaste que el dinero ingresó en la cuenta del local?'))return;if(next==='cancelado'&&!confirm('¿Cancelar esta reserva sin pago y liberar la mercadería?'))return;const separated=el.querySelector('[data-separated]')?.checked===true||(o.status==='pago_a_verificar'&&confirm('¿La mercadería sigue físicamente separada para este pedido?'));await rpc('pedidosAdminUpdate',token,{id:o.id,version:o.version,status:next,total:el.querySelector('[data-total]')?.value||o.total,separated});await refresh();}));
}
$('refresh').onclick=()=>busy($('refresh'),refresh);$('branch').onchange=render;$('logout').onclick=()=>busy($('logout'),async()=>{await rpc('logout',token);token='';orders=[];$('orders').innerHTML='';$('work').hidden=true;$('login').hidden=false;status('Sesión cerrada.');});
</script></body></html>
